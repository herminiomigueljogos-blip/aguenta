<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aguenta Sem Rir</title>
<meta name="description" content="O jogo em que rir é perder. Com Miguel Vilhena e convidados.">
<meta property="og:type" content="website">
<meta property="og:title" content="Aguenta Sem Rir">
<meta property="og:description" content="O jogo em que rir é perder. Com Miguel Vilhena e convidados.">
<meta property="og:image" content="https://herminiomigueljogos-blip.github.io/aguenta/capa-jogo.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://herminiomigueljogos-blip.github.io/aguenta/jogo.html">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Palco de stand-up: cortinas bordeaux, foco dourado, creme. Uma coluna de telemóvel, centrada no ecrã grande. */
:root{
  color-scheme:dark;
  --bg:#1d0a12; --curtain:#5a1226; --curtain2:#46101f;
  --panel:#32121f; --panel2:#43182a; --line:#64303f;
  --ink:#fff4dc; --muted:#cfae9f;
  --gold:#ffc233; --gold-deep:#c98a00; --gold-ink:#2a1500;
  --good:#2fd0b5; --bad:#ff5d4d; --epic:#b66dff; --rare:#4fb3ff;
  --display:"Lilita One","Chango",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;overflow-x:hidden}
@media(min-width:520px){body{background:repeating-linear-gradient(90deg,var(--curtain) 0 40px,var(--curtain2) 40px 80px)}}
#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 70px rgba(0,0,0,.65)}
#screen{flex:1;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.3px;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
small{color:var(--muted)}

/* botões */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 18px;background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-size:20px;box-shadow:0 5px 0 var(--gold-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-deep)}
.btn small{display:block;font-family:var(--body);font-weight:700;font-size:12px;color:inherit;opacity:.75}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:0 5px 0 #25101a;border:2px solid var(--line)}
.btn.alt:active{box-shadow:0 1px 0 #25101a}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line);font-size:16px;padding:10px 14px}
.btn.sm{display:inline-block;width:auto;font-size:15px;padding:8px 14px;box-shadow:0 3px 0 var(--gold-deep)}
.row{display:flex;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}

/* topo e nível */
.home,.page{padding:16px 16px 20px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:30px;line-height:1;color:var(--gold)}
.brand small{display:block;font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:11px}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
.chip b{color:var(--gold)}
.xpbar{height:8px;border-radius:99px;background:#2a0f1a;overflow:hidden;margin-top:-6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe08a);border-radius:99px;transition:width .6s}

/* desafio do dia */
.daily{background:linear-gradient(160deg,var(--panel2),var(--panel));border:2px solid var(--gold);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.daily h2{font-size:21px}
.daily .steps{display:flex;gap:8px}
.daily .steps span{flex:1;text-align:center;background:#240c16;border-radius:12px;padding:7px 4px;font-size:12px;font-weight:800;color:var(--muted)}
.daily .steps span.ok{color:var(--good)}.daily .steps span.ko{color:var(--bad)}
.flame{font-weight:800;color:var(--gold)}

/* modos */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:2px solid var(--line);background:var(--panel);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative;overflow:hidden}
.tile h3{font-size:19px;line-height:1.05}
.tile p{margin:0;font-size:13px;color:var(--muted)}
.tile .ic{font-size:30px;line-height:1}
.tile.hero{grid-column:1/-1;background:linear-gradient(130deg,#7a1630,#4a0f20);border-color:var(--gold);min-height:132px}
.tile.hero h3{font-size:28px;color:var(--gold)}
.tile.hero p{color:var(--ink)}
.tile .best{position:absolute;right:12px;top:10px;font-size:12px;font-weight:800;color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:22px;color:var(--gold);font-weight:400}
.stat small{font-size:11px;font-weight:700}
.tip{background:#2a1019;border:1px dashed var(--line);border-radius:14px;padding:12px;font-size:14px}

/* tabs */
#tabs{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:#26101a;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{background:none;border:0;padding:13px 2px;font-weight:800;font-size:13px;color:var(--muted)}
#tabs button.on{color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}

/* palco */
.play{display:flex;flex-direction:column;flex:1;min-height:100dvh;position:relative}
.hud{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#240c16;border-bottom:2px solid var(--line)}
.hud .x{background:none;border:2px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:18px}
#hudmid{flex:1;display:flex;justify-content:center;gap:6px;font-family:var(--display);font-size:22px}
.h{color:#ff5a6e;transition:transform .2s}.h.lost{color:#5b3a44;transform:scale(.8)}
.sc{text-align:right;min-width:78px}
.sc b{font-family:var(--display);font-size:26px;font-weight:400;color:var(--gold);display:block;line-height:1}
.sc small{font-weight:800}
.bump{animation:bump .3s}
.theatre{position:relative;height:clamp(170px,30dvh,260px);background:radial-gradient(70% 90% at 50% 0,rgba(255,206,90,.38),rgba(255,206,90,0) 70%),linear-gradient(#150711,#2a0d19);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;border-bottom:2px solid var(--line)}
.theatre::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#3b1624,#240c16)}
.theatre svg{height:78%;position:relative;z-index:1;margin-bottom:10px}
.theatre .who{position:absolute;left:12px;top:10px;z-index:2;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.theatre video.clip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.camwrap{position:absolute;right:10px;bottom:10px;z-index:3;width:76px;height:100px;border-radius:12px;overflow:hidden;border:2px solid var(--gold);background:#000}
.camwrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.arena{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px;position:relative}
.caption{min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;text-align:center;position:relative}
.ln{font-size:21px;font-weight:800;line-height:1.25;animation:rise .35s both}
.ln.old{opacity:.5;font-size:17px;font-weight:700;animation:none}
.ln.punch{font-family:var(--display);font-size:30px;font-weight:400;color:var(--gold);animation:pop .5s both}
.count{font-family:var(--display);font-size:92px;color:var(--gold);animation:pop .45s both;text-align:center}
.caption.shake{animation:shake .45s}
.fly{position:absolute;font-size:46px;left:-10%;top:30%;animation:fly 1.2s linear forwards;pointer-events:none}
.meterbox{display:flex;flex-direction:column;gap:4px;align-items:center}
.meterbox.off{display:none}
.meter{width:100%;height:16px;border-radius:99px;background:#2a0f1a;border:2px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--good),var(--gold) 60%,var(--bad));transition:width .08s}
.hint{text-align:center;font-size:13px;color:var(--muted)}
.laugh{align-self:center;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 20px;font-weight:800;font-size:15px}
.tl{height:6px;border-radius:99px;background:#2a0f1a;overflow:hidden}
.tl i{display:block;height:100%;width:0;background:var(--gold)}
.ov{position:absolute;inset:0;background:rgba(18,5,10,.92);z-index:6;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .2s}
.ovc{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;text-align:center}
.ovc h3{font-size:40px}.ovc.good h3{color:var(--good)}.ovc.bad h3{color:var(--bad)}
.pts{margin:0;font-family:var(--display);font-size:26px;color:var(--gold)}
.remate{margin:0;font-size:16px;font-weight:700;color:var(--ink);background:var(--panel);border-radius:14px;padding:10px}
.flash{position:fixed;inset:0;z-index:30;pointer-events:none;animation:flash .5s forwards}
.flash.bad{background:rgba(255,70,60,.35)}.flash.good{background:rgba(47,208,181,.25)}

/* adivinhas */
.q{background:var(--panel);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:center}
.q h2{font-size:23px;line-height:1.2}
.qk{align-self:center;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.jtxt{font-size:15px;line-height:1.4;text-align:left;margin:0;color:var(--ink)}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--panel2);border-radius:16px;padding:14px;font-weight:800;font-size:17px;text-align:left;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt.good{background:#0f4f46;border-color:var(--good)}.opt.bad{background:#5b1d1d;border-color:var(--bad)}.opt.gone{visibility:hidden}
.opt:disabled{opacity:1}

/* resultado */
.result{padding:22px 16px;display:flex;flex-direction:column;gap:14px;text-align:center;min-height:100dvh}
.rtitle{font-family:var(--display);font-size:24px;color:var(--muted)}
.rbig{font-family:var(--display);font-size:72px;color:var(--gold);line-height:1}
.newrec{align-self:center;background:var(--gold);color:var(--gold-ink);font-weight:800;border-radius:99px;padding:4px 14px;animation:pop .5s both}
.rrows{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.newcards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rbtns{display:flex;flex-direction:column;gap:12px;margin-top:6px}

/* cromos */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 4px 10px;text-align:center;font-size:11px;font-weight:800;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;min-height:96px}
.card .e{font-size:34px;line-height:1.1}
.card.r1{border-color:#8a6a52}.card.r2{border-color:var(--rare);background:linear-gradient(#173246,var(--panel))}.card.r3{border-color:var(--epic);background:linear-gradient(#35205a,var(--panel))}
.card.lock{opacity:.45;border-style:dashed}
.card.flip{animation:flip .7s both}
.card.big{min-width:96px;min-height:120px;padding:10px}
.rar{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.prog{height:10px;border-radius:99px;background:#2a0f1a;overflow:hidden}.prog i{display:block;height:100%;background:var(--good)}

/* perfil */
.ach{display:grid;gap:8px}
.ach div{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:12px;padding:10px;opacity:.5}
.ach div.on{opacity:1;border:1px solid var(--gold)}
.ach b{display:block;font-size:14px}.ach small{font-size:12px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border-radius:12px;padding:12px}
.set input[type=range]{width:55%}
.sw{width:50px;height:28px;border-radius:99px;border:2px solid var(--line);background:#2a0f1a;position:relative;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw.on{background:var(--good);border-color:var(--good)}.sw.on::after{left:24px;background:#fff}

/* duelo */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;font-weight:800}
.seg button.on{border-color:var(--gold);background:#4a2a14;color:var(--gold)}
.code{font-family:var(--display);font-size:58px;letter-spacing:8px;color:var(--gold);text-align:center}
input[type=text],input[type=tel]{width:100%;background:#240c16;border:2px solid var(--line);border-radius:14px;color:var(--ink);padding:12px;font-size:22px;text-align:center;font-family:var(--display);letter-spacing:6px}

.perf{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.perf button{flex:0 0 auto;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px}
.perf button.on{border-color:var(--gold);color:var(--gold);background:#4a2a14}
.set1{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.set1 h3{font-size:21px}.set1 .by{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.set1.done{border-color:var(--good)}

/* capa */
.cover{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:14px;padding:26px 20px 28px;text-align:center;position:relative;overflow:hidden;background:
 radial-gradient(60% 45% at 50% 22%,rgba(255,200,80,.45),rgba(255,200,80,0) 70%),
 linear-gradient(90deg,#5a1226 0,#3d0c1a 14%,#1d0a12 30%,#1d0a12 70%,#3d0c1a 86%,#5a1226 100%)}
.cover .kick{font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.arch{width:min(68vw,270px);aspect-ratio:4/5;border-radius:999px 999px 24px 24px;border:5px solid var(--gold);overflow:hidden;box-shadow:0 0 0 6px #1d0a12,0 0 60px rgba(255,194,51,.45),0 18px 40px rgba(0,0,0,.6);background:#000}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.cover h1{font-size:clamp(46px,14vw,64px);line-height:.95;color:var(--gold);text-shadow:0 4px 0 #8a5a00,0 10px 24px rgba(0,0,0,.6)}
.cover h1 span{display:block;color:var(--ink);font-size:.62em;text-shadow:0 3px 0 #5a1226}
.cover .with{font-size:15px;font-weight:800;color:var(--ink)}
.cover .with b{color:var(--gold);font-family:var(--display);font-weight:400;font-size:22px;display:block;letter-spacing:.5px}
.cover .tag{font-size:14px;color:var(--muted);margin:0}
.cover .btn{max-width:320px}
.host{width:112px;height:112px;border-radius:50%;border:4px solid var(--gold);overflow:hidden;margin-bottom:14px;position:relative;z-index:1;box-shadow:0 0 30px rgba(255,194,51,.4)}
.host img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--gold);color:var(--gold-ink);font-weight:800;border-radius:99px;padding:9px 16px;opacity:0;pointer-events:none;transition:.3s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:50;background:rgba(18,5,10,.85);display:flex;align-items:center;justify-content:center;padding:18px}
#modal .mb{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:88dvh;overflow:auto}
#modal textarea{width:100%;min-height:90px;background:#240c16;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}

@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px) rotate(-1deg)}40%{transform:translateX(9px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes fly{from{left:-12%;transform:rotate(0)}to{left:105%;transform:rotate(540deg)}}
@keyframes flash{from{opacity:1}to{opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bump{50%{transform:scale(1.25)}}
@keyframes flip{from{transform:rotateY(90deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <nav id="tabs" aria-label="Navegação">
    <button data-act="go" data-to="home">Jogar</button>
    <button data-act="go" data-to="stand">Stand-up</button>
    <button data-act="go" data-to="duel">Duelo</button>
    <button data-act="go" data-to="album">Cromos</button>
    <button data-act="go" data-to="profile">Perfil</button>
  </nav>
</div>
<div id="toast" role="status"></div>
<div id="modal" hidden></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function(){
'use strict';

/* ================= utilitários ================= */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function rng(seed){var a=seed>>>0;return function(){a+=0x6D2B79F5;var t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rand){rand=rand||Math.random;var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rand()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayNum(s){return Math.floor(Date.parse(s+'T00:00:00Z')/86400000)}
function dailyNo(){return dayNum(today())-dayNum('2026-11-01')+1}
var TS=/[?&]fast=1/.test(location.search)?0.12:1;
var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= dados guardados ================= */
var KEY='aguenta.v3';
var DEF={xp:0,streak:0,lastDay:null,freezes:0,best:{run:0,blitz:0,rem:0},cards:{},ach:{},
  st:{runs:0,jokes:0,laughs:0,rid:0,ok:0,okStreak:0,duelWins:0,rem:0},daily:{},set:{sound:true,cam:true,sens:0.5,pace:1.5}};
var S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
S=S||{};
Object.keys(DEF).forEach(function(k){if(S[k]==null)S[k]=JSON.parse(JSON.stringify(DEF[k]));else if(typeof DEF[k]==='object'&&!Array.isArray(DEF[k]))S[k]=Object.assign({},DEF[k],S[k])});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ================= som, vibração, confetes ================= */
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function tone(f,d,type,g,slide,delay){if(!S.set.sound)return;var c=ac();if(!c)return;var t=c.currentTime+(delay||0);var o=c.createOscillator(),v=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);v.gain.setValueAtTime(g||.1,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(c.destination);o.start(t);o.stop(t+d+.03)}

function confetti(n,x,y){n=reduced?Math.min(n,18):n;var C=['#ffc233','#2fd0b5','#ff5d4d','#b66dff','#4fb3ff','#fff4dc'];for(var i=0;i<n;i++)parts.push({x:(x==null?.5:x)*fx.width,y:(y==null?.4:y)*fx.height,vx:(Math.random()-.5)*11,vy:-Math.random()*13-3,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:C[i%C.length],l:80+Math.random()*50});if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}}
function fxLoop(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(function(p){return p.l>0&&p.y<fx.height+20});parts.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l--;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.fillStyle=p.c;fctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);fctx.restore()});if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=false;fctx.clearRect(0,0,fx.width,fx.height)}}

function go(name){if(name!=='play')stopRun();view={name:name};render()}
function render(){
  var s=$('#screen');
  var tabs=['home','stand','duel','album','profile'].indexOf(view.name)>=0;
  $('#tabs').hidden=!tabs;
  $$('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.to===view.name)});
  if(view.name==='splash'){s.innerHTML=coverHTML();$('#tabs').hidden=true}
  else if(view.name==='home'){s.innerHTML=homeHTML();maybeBreak()}
  else if(view.name==='duel')s.innerHTML=duelHTML();
  else if(view.name==='stand')s.innerHTML=standHTML();
  else if(view.name==='album')s.innerHTML=albumHTML();
  else if(view.name==='profile')s.innerHTML=profileHTML();
  window.scrollTo(0,0);
}

function setTheatre(joke){
  var t=$('#theatre');if(!t)return;
  var inner;

  t.innerHTML=inner+'<div class="camwrap" id="camwrap" hidden></div>';

}
function hud(o){
  if(o.hearts!=null)$('#hudmid').innerHTML=[0,1,2].map(function(i){return '<span class="h '+(i<o.hearts?'':'lost')+'">♥</span>'}).join('');
  if(o.mid!=null)$('#hudmid').innerHTML=o.mid;
  if(o.score!=null){var s=$('#score');s.textContent=o.score;s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump')}
  if(o.mult!==undefined)$('#mult').textContent=o.mult?'×'+o.mult:'';
}

    '<button class="laugh" data-act="laugh">😂 Ri-me</button><div class="tl"><i id="tl"></i></div>';
  setTheatre(joke);
  var cap=$('#cap'),mf=$('#mf'),tl=$('#tl');
  Face.reset();run.manual=false;
  for(var k=3;k>=1;k--){
    cap.innerHTML='<div class="count">'+k+'</div>';SFX.tick();
    var t0=performance.now();while(performance.now()-t0<800*Math.max(TS,.25)){Face.tick(true);if(!alive(run))return {aborted:true};await sleep(70)}
  }
  cap.innerHTML='';SFX.go();
  var vid=$('#theatre video.clip');if(vid){try{vid.play()}catch(e){}}
  var sched=[],t=500*TS;
  joke.lines.forEach(function(l){sched.push({t:t,text:l});t+=(1500+wc(l)*420)*(S.set.pace||1.5)*TS});
  var tension=(2200+(joke.n===3?800:0))*TS,tr=t+tension;
  sched.push({t:tr,text:joke.r,punch:true});
  var end=tr+4500*TS;
  var ds=[];var nd=joke.n===3?2:joke.n===2?1:0;
  for(var d=0;d<nd;d++)ds.push(1800*TS+Math.random()*(tr-2400*TS));
  var res={laughed:false},next=0,t00=performance.now(),lastF=0;
  await new Promise(function(done){
    function frame(now){
      if(!alive(run)){res={aborted:true};return done()}
      var el=now-t00;
      while(next<sched.length&&el>=sched[next].t){showLine(cap,sched[next].text,sched[next].punch);next++}
      for(var i=ds.length-1;i>=0;i--)if(el>=ds[i]){ds.splice(i,1);distract(cap)}
      if(now-lastF>70){lastF=now;Face.tick(false)}
      if(cam)mf.style.width=Math.min(100,Face.level*100)+'%';
      tl.style.width=Math.min(100,el/end*100)+'%';
      if(run.manual||(cam&&Face.laughing)){res={laughed:true,at:el};return done()}
      if(el>=end)return done();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
  if(res.aborted)return res;
  if(res.laughed){SFX.bad();vib([120,60,120]);flash('bad');cap.classList.add('shake');if(next<sched.length)showLine(cap,joke.r,true)}
  else{SFX.good();vib(40);flash('good');confetti(30,.5,.45)}
  res.total=end;return res;
}

/* ----- adivinha ----- */
function askRiddle(run,r,o){
  o=o||{};var time=o.time||20,arena=$('#arena');
  return new Promise(function(res){
    if(!arena)return res({aborted:true});
    var order=shuffle([0,1,2,3]);
    arena.innerHTML='<div class="q"><span class="qk">'+(r.n===3?'Difícil':r.n===2?'Média':'Fácil')+'</span><h2>'+esc(r.q)+'</h2></div>'+
     '<div class="opts">'+order.map(function(oi){return '<button class="opt" data-act="opt" data-oi="'+oi+'">'+esc(r.o[oi])+'</button>'}).join('')+'</div>'+
     '<div class="tl"><i id="qtl"></i></div>'+(o.fifty?'<button class="btn ghost sm" data-act="fifty" id="f50" style="align-self:center">50/50</button>':'');
    var t0=performance.now(),done=false;
    var timer=setInterval(function(){
      if(!alive(run)){clearInterval(timer);return res({aborted:true})}
      var p=(performance.now()-t0)/(time*1000),b=$('#qtl');if(b)b.style.width=Math.max(0,100-p*100)+'%';
      if(p>=1)finish(-1)},60);
    function finish(oi){
      if(done)return;done=true;clearInterval(timer);run.onopt=null;
      var ok=oi===r.c;
      $$('.opt').forEach(function(b){b.disabled=true;var v=+b.dataset.oi;if(v===r.c)b.classList.add('good');else if(v===oi)b.classList.add('bad')});
      if(oi===-1){SFX.bad()}else if(ok){SFX.good();vib(30)}else{SFX.bad();vib([80,40,80])}
      setTimeout(function(){res({correct:ok,ms:performance.now()-t0,timeout:oi===-1})},o.reveal||900);
    }
    run.onopt=function(oi){finish(oi)};
    run.fifty=function(){var wrong=[0,1,2,3].filter(function(i){return i!==r.c});shuffle(wrong).slice(0,2).forEach(function(w){var b=$('.opt[data-oi="'+w+'"]');if(b)b.classList.add('gone')});var f=$('#f50');if(f)f.remove()};
  });
}

/* ----- remata: escolher o final certo ----- */
function askRemata(run,j,o){
  o=o||{};var arena=$('#arena');
  return new Promise(function(res){
    if(!arena)return res({aborted:true});
    var opts=shuffle([{t:j.r,ok:true},{t:j.f[0],ok:false},{t:j.f[1],ok:false}]);
    arena.innerHTML='<div class="q"><span class="qk">Qual é o remate?</span><p class="jtxt">'+j.lines.map(esc).join('<br>')+'</p></div>'+
     '<div class="opts">'+opts.map(function(x,i){return '<button class="opt" data-act="opt" data-oi="'+i+'">'+esc(x.t)+'</button>'}).join('')+'</div><div class="tl"><i id="qtl"></i></div>';
    var t0=performance.now(),done=false,time=o.time||18;
    var timer=setInterval(function(){
      if(!alive(run)){clearInterval(timer);return res({aborted:true})}
      var p=(performance.now()-t0)/(time*1000),b=$('#qtl');if(b)b.style.width=Math.max(0,100-p*100)+'%';
      if(p>=1)finish(-1)},60);
    function finish(i){
      if(done)return;done=true;clearInterval(timer);run.onopt=null;
      var ok=i>=0&&opts[i].ok;
      $$('.opt').forEach(function(b){b.disabled=true;var v=+b.dataset.oi;if(opts[v].ok)b.classList.add('good');else if(v===i)b.classList.add('bad')});
      if(ok){SFX.good();vib(30)}else{SFX.bad();vib([80,40,80])}
      setTimeout(function(){res({correct:ok,ms:performance.now()-t0})},1000);
    }
    run.onopt=function(i){finish(i)};
  });
}

/* ================= modo: maratona ================= */
async function runMarathon(){
  var run=newRun('marathon');enterStage();
  var lives=3,score=0,mult=1,surv=0,idx=0,risk=false,mortal=false,used=new Set(),earned=[];
  hud({hearts:3,score:0,mult:1});
  $('#arena').innerHTML='<div class="caption"><div class="ln">A preparar a câmara…</div></div>';
  await Face.start();if(!alive(run))return;
  S.st.runs++;save();
  while(lives>0&&alive(run)){
    var level=risk?3:(idx<2?1:idx<4?2:3);
    var joke=pickJoke(level,used);
    var res=await playJoke(run,joke);
    if(!alive(run)||res.aborted)return;
    var lost=0,pts=0,newCard=null;
    if(res.laughed){lost=risk?2:1;lives=Math.max(0,lives-lost);mult=1;S.st.laughs++}
    else{surv++;S.st.jokes++;pts=(joke.n*100*mult+50)*(risk?2:1);score+=pts;mult=Math.min(5,mult+1);if(joke.n===3)mortal=true;if(giveCard(joke.id)){earned.push(joke.id);newCard=ALL.filter(function(c){return c.id===joke.id})[0]}}
    save();hud({hearts:lives,score:score,mult:mult});
    checkAch({runSurv:surv,mortal:mortal});
    idx++;
    if(lives<=0){await pause(run,1500);break}
    overlay('<div class="ovc '+(res.laughed?'bad':'good')+'"><h3>'+(res.laughed?'Riste-te!':'Aguentaste!')+'</h3><p class="pts">'+(res.laughed?'−'+lost+(lost>1?' vidas':' vida'):'+'+pts+' pontos')+'</p><p class="remate">'+esc(joke.r)+'</p>'+(newCard?'<div class="newcards">'+cardHTML(newCard,true)+'</div>':'')+
      '<button class="btn" data-act="choose" data-v="next">Próxima anedota</button>'+(lives>=2?'<button class="btn alt" data-act="choose" data-v="risk">Arriscar ×2<small>anedota mortal · se te rires, perdes 2 vidas</small></button>':'')+'</div>');
    if(newCard)SFX.card();
    var ch=await waitChoice(run);closeOv();if(!alive(run))return;
    risk=ch==='risk';
  }
  if(!alive(run))return;
  var rec=score>S.best.run;if(rec)S.best.run=score;
  var xp=addXp(score/25+surv*20);checkAch({runSurv:surv,mortal:mortal});save();
  showResult({title:'Fim da maratona',big:score,record:rec,rows:[['Aguentadas',surv],['Cromos novos',earned.length],['XP',  '+'+xp]],cards:earned,
    btns:'<button class="btn" data-act="marathon">Mais uma!</button><button class="btn alt" data-act="sharerun" data-s="'+score+'" data-n="'+surv+'">Desafiar um amigo</button><button class="btn ghost" data-act="go" data-to="home">Início</button>'});
}

    if(left<=0){over=true;clearInterval(tick);if(run.onopt)run.onopt(-1)}
  },100);

    else{streak=0;if(!over)left-=4000;hud({mult:1})}
    save();checkAch();
  }
  clearInterval(tick);if(!alive(run))return;
  var rec=score>S.best.blitz;if(rec)S.best.blitz=score;
  var xp=addXp(score/20+right*8);save();checkAch();

}

function mkNet(code){
  var ch=null;try{ch=new BroadcastChannel('aguenta-duelo-'+code)}catch(e){return null}
  var n={me:Math.random().toString(36).slice(2,8),box:[],ch:ch,hooks:[]};
  ch.onmessage=function(e){var m=e.data;if(!m||m.from===n.me)return;n.box.push(m);n.hooks.slice().forEach(function(h){h(m)})};
  n.send=function(m){m.from=n.me;ch.postMessage(m)};
  n.waitFor=function(pred,ms){return new Promise(function(res){var f=n.box.filter(pred)[0];if(f)return res(f);var to=setTimeout(function(){n.hooks=n.hooks.filter(function(x){return x!==h});res(null)},ms);function h(m){if(pred(m)){clearTimeout(to);n.hooks=n.hooks.filter(function(x){return x!==h});res(m)}}n.hooks.push(h)})};
  n.close=function(){try{ch.close()}catch(e){}};
  return n;
}
function mkBot(mode){
  return {me:'bot',send:function(){},close:function(){},
   waitFor:function(pred,ms){return sleep(700).then(function(){
     if(mode==='aguenta'){var l=Math.random()<.45;return {t:'res',laughed:l,at:l?3000+Math.random()*6000:0}}
     var ok=Math.random()<.65;return {t:'res',correct:ok,ms:3000+Math.random()*8000}})}};
}
async function startDuel(net,mode,seed,isBot){
  var run=newRun('duel');enterStage();
  var me=0,them=0;
  $('#arena').innerHTML='<div class="caption"><div class="ln">A preparar a câmara…</div></div>';
  if(mode==='aguenta')await Face.start();
  if(!alive(run))return;
  for(var rd=0;rd<3&&alive(run);rd++){
    hud({mid:'Ronda '+(rd+1)+'/3 · '+me+'–'+them,score:null});
    var rand=rng(seed+rd*97),mine,opp;
    if(mode==='aguenta'){
      var j=JOKES[Math.floor(rand()*JOKES.length)];
      var r=await playJoke(run,j);if(!alive(run)||r.aborted)return;
      mine={t:'res',round:rd,laughed:!!r.laughed,at:r.at||0};
    }else{
      var q=RIDDLES[Math.floor(rand()*RIDDLES.length)];
      var a=await askRiddle(run,q,{time:15,reveal:700});if(!alive(run)||a.aborted)return;
      mine={t:'res',round:rd,correct:!!a.correct,ms:a.ms};
    }
    net.send(mine);
    $('#arena').innerHTML='<div class="caption"><div class="ln">À espera do adversário…</div></div>';
    opp=await net.waitFor(function(m){return m.t==='res'&&(isBot||m.round===rd)},60000);
    if(!alive(run))return;
    var w=0;
    if(!opp)w=1;
    else if(mode==='aguenta'){var a1=mine.laughed?mine.at:1e9,b1=opp.laughed?opp.at:1e9;w=a1===b1?0:(a1>b1?1:-1);if(mine.laughed&&opp.laughed&&Math.abs(a1-b1)<250)w=0}
    else{if(mine.correct&&!opp.correct)w=1;else if(!mine.correct&&opp.correct)w=-1;else if(mine.correct&&opp.correct)w=mine.ms<opp.ms?1:-1}
    if(w>0)me++;else if(w<0)them++;
    overlay('<div class="ovc '+(w>0?'good':w<0?'bad':'')+'"><h3>'+(w>0?'Ponto teu!':w<0?'Ponto dele':'Empate')+'</h3><p class="pts">'+me+' – '+them+'</p></div>');
    (w>0?SFX.good:w<0?SFX.bad:SFX.tick)();
    await pause(run,1700);closeOv();
  }
  if(!alive(run))return;
  net.close();
  var win=me>them;if(win){S.st.duelWins++}
  var xp=addXp(win?120:40);save();checkAch();
  showResult({title:win?'Ganhaste o duelo!':me===them?'Empate':'Perdeste o duelo',big:me,rows:[['Tu',me],['Adversário',them],['XP','+'+xp]],record:win,cards:[],
    btns:'<button class="btn" data-act="go" data-to="duel">Novo duelo</button><button class="btn ghost" data-act="go" data-to="home">Início</button>'});
}

/* ================= cromos e perfil ================= */
function albumHTML(){
  var n=cardCount();
  return '<section class="page"><h2 style="font-size:32px;color:var(--gold)">Cromos</h2><div class="prog" aria-label="Progresso"><i style="width:'+Math.round(n/ALL.length*100)+'%"></i></div><small>'+n+' de '+ALL.length+' · aguenta anedotas e acerta adivinhas para os descobrir. Os mais difíceis são os mais raros.</small>'+
   '<div class="cards">'+ALL.map(function(c){return S.cards[c.id]?'<button class="card r'+c.n+'" data-act="cardinfo" data-id="'+c.id+'" style="color:inherit"><span class="e">'+c.e+'</span><span>'+esc(c.t)+'</span><span class="rar">'+RAR[c.n]+'</span></button>':'<div class="card lock"><span class="e">❔</span><span>'+RAR[c.n]+'</span></div>'}).join('')+'</div></section>';
}
function profileHTML(){
  var lv=lvlOf(S.xp);
  return '<section class="page"><h2 style="font-size:32px;color:var(--gold)">Perfil</h2>'+
   '<div class="daily"><div class="row" style="justify-content:space-between;align-items:center"><h2>'+esc(titleOf(lv.l))+'</h2><b style="color:var(--gold)">Nível '+lv.l+'</b></div><div class="prog"><i style="width:'+Math.round(lv.cur/lv.need*100)+'%"></i></div><small>'+lv.cur+' / '+lv.need+' XP para o próximo nível</small></div>'+
   '<div class="stats"><div class="stat"><b>'+S.st.jokes+'</b><small>Aguentadas</small></div><div class="stat"><b>'+S.st.laughs+'</b><small>Risos</small></div><div class="stat"><b>'+S.st.ok+'</b><small>Adivinhas certas</small></div></div>'+
   '<h3 style="font-size:22px">Conquistas</h3><div class="ach">'+ACH.map(function(a){return '<div class="'+(S.ach[a.id]?'on':'')+'"><span style="font-size:22px">'+(S.ach[a.id]?'🏆':'🔒')+'</span><span><b>'+esc(a.t)+'</b><small>'+esc(a.d)+'</small></span></div>'}).join('')+'</div>'+
   '<h3 style="font-size:22px">Definições</h3>'+
   '<div class="set"><label for="sw-som">Som</label><button class="sw '+(S.set.sound?'on':'')+'" id="sw-som" data-act="tog" data-k="sound" role="switch" aria-checked="'+S.set.sound+'"></button></div>'+
   '<div class="set"><label for="sw-cam">Usar a câmara (deteta o sorriso)</label><button class="sw '+(S.set.cam?'on':'')+'" id="sw-cam" data-act="tog" data-k="cam" role="switch" aria-checked="'+S.set.cam+'"></button></div>'+
   '<div class="set"><label for="pace">Tempo para ler (esq. rápido, dir. lento)</label><input type="range" id="pace" min="1" max="2.5" step="0.25" value="'+S.set.pace+'" data-act="pace"></div>'+
   '<div class="set"><label for="sens">Sensibilidade do sorriso</label><input type="range" id="sens" min="0" max="1" step="0.05" value="'+S.set.sens+'" data-act="sens"></div>'+
   '<p class="tip" style="margin:0">A câmara é analisada no próprio telemóvel e a imagem não sai dele nem é guardada.</p>'+
   '<button class="btn ghost" data-act="resetall">Apagar o meu progresso</button></section>';
}

/* ================= eventos ================= */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;ac();
  if(a==='go')go(el.dataset.to);
  else if(a==='marathon')runMarathon();
  else if(a==='blitz')runBlitz();
  else if(a==='remata')runRemata();
  else if(a==='daily')runDaily();
  else if(a==='enter'){ac();go('home')}
  else if(a==='quit'){go(RUN&&RUN.kind==='stand'?'stand':'home')}
  else if(a==='sfilter'){sf=el.dataset.p;render()}
  else if(a==='standplay')runStandup(el.dataset.id);
  else if(a==='skip'){if(RUN)RUN.skip=true}
  else if(a==='gohome'){closeModal();go('home')}
  else if(a==='mclose')closeModal();
  else if(a==='choose'){if(RUN&&RUN.resolve){var r=RUN.resolve;RUN.resolve=null;r(el.dataset.v)}}
  else if(a==='opt'){if(RUN&&RUN.onopt)RUN.onopt(+el.dataset.oi)}
  else if(a==='fifty'){if(RUN&&RUN.fifty)RUN.fifty()}
  else if(a==='laugh'){if(RUN)RUN.manual=true}
  else if(a==='sharedaily')share(dailyShareText());
  else if(a==='sharerun'){var k=el.dataset.k==='blitz'?'adivinhas relâmpago':'maratona';share('Fiz '+el.dataset.s+' pontos na '+k+' do Aguenta Sem Rir. Consegues bater-me?'+(/^https?:/.test(location.href)?'\n'+location.href.split('?')[0]:''))}
  else if(a==='cardinfo'){
    var c=ALL.filter(function(x){return x.id===el.dataset.id})[0];var body='';
    if(c.k==='j'){var j=JOKES.filter(function(x){return x.id===c.id})[0];body='<p class="jtxt">'+j.lines.map(esc).join('<br>')+'</p><p class="remate">'+esc(j.r)+'</p>'}
    else if(c.k==='s'){var st=STANDUP.filter(function(x){return x.id===c.id})[0];body='<p class="jtxt">'+st.lines.map(esc).join('<br>')+'</p><p class="remate">'+esc(st.r)+'</p><small>por '+esc(PBY[st.by].name)+'</small>'}
    else{var r=RIDDLES.filter(function(x){return x.id===c.id})[0];body='<p class="jtxt">'+esc(r.q)+'</p><p class="remate">Resposta: '+esc(r.o[r.c])+'</p>'}
    modal('<div style="text-align:center">'+cardHTML(c,false)+'</div>'+body+'<button class="btn" data-act="mclose">Fechar</button>');
  }
  else if(a==='tog'){var k2=el.dataset.k;S.set[k2]=!S.set[k2];save();render()}
  else if(a==='resetall'){modal('<h3>Apagar tudo?</h3><p style="margin:0">Perdes o nível, os cromos, a sequência e as conquistas.</p><button class="btn alt" data-act="reallyreset">Sim, apagar</button><button class="btn" data-act="mclose">Cancelar</button>')}
  else if(a==='reallyreset'){try{localStorage.removeItem(KEY)}catch(x){}Object.keys(DEF).forEach(function(k){S[k]=JSON.parse(JSON.stringify(DEF[k]))});closeModal();render();toast('Progresso apagado')}
  else if(a==='dmode'){duel.mode=el.dataset.m;render()}
  else if(a==='duelcreate'){
    var code=String(1000+Math.floor(Math.random()*9000));var net=mkNet(code);
    if(!net){duel.msg='Este navegador não suporta salas. Treina contra o robô.';render();return}
    duel.net=net;duel.code=code;duel.state='wait';duel.msg='';render();
    net.waitFor(function(m){return m.t==='join'},300000).then(function(m){
      if(!m||duel.state!=='wait')return;duel.state='lobby';var seed=Math.floor(Math.random()*1e6);
      net.send({t:'go',mode:duel.mode,seed:seed});startDuel(net,duel.mode,seed,false);
    });
  }
  else if(a==='dueljoin'){
    var cd=($('#dcode')||{}).value||'';if(!/^\d{4}$/.test(cd)){duel.msg='Escreve o código de 4 números.';render();return}
    var n2=mkNet(cd);if(!n2){duel.msg='Este navegador não suporta salas.';render();return}
    n2.send({t:'join'});
    n2.waitFor(function(m){return m.t==='go'},4000).then(function(m){
      if(!m){n2.close();duel.msg='Sala não encontrada. Confirma o código e que o amigo a criou neste navegador.';render();return}
      startDuel(n2,m.mode,m.seed,false);
    });
  }
  else if(a==='duelbot'){startDuel(mkBot(duel.mode),duel.mode,Math.floor(Math.random()*1e6),true)}
  else if(a==='duelcancel'){if(duel.net)duel.net.close();duel.state='lobby';render()}
});
document.addEventListener('input',function(e){if(e.target.dataset&&e.target.dataset.act==='sens'){S.set.sens=parseFloat(e.target.value);save()}if(e.target.dataset&&e.target.dataset.act==='pace'){S.set.pace=parseFloat(e.target.value);save()}});
document.addEventListener('keydown',function(e){if(view.name==='play'&&RUN&&(e.key==='r'||e.key==='R'||e.key===' ')){if(e.key===' ')e.preventDefault();RUN.manual=true}});

view={name:(TS<1&&!/splash=1/.test(location.search))?'home':'splash'};
render();
})();
</script>
